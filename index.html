<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Explorer — Medicare Advantage Intelligence</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    :root{
      --bg:#0a0b12; --bg-soft:#12131d; --panel:#141522;
      --ink:#e7e9f5; --muted:#8b90b0;
      --accent:#7c6cf6; --accent2:#a78bfa; --accent-soft:rgba(124,108,246,0.15);
      --gold:#f5b83d; --gold-soft:rgba(245,184,61,0.14);
      --line:rgba(255,255,255,0.07);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);
      background:
        radial-gradient(1100px 700px at 12% -8%, rgba(124,108,246,0.16), transparent 60%),
        radial-gradient(900px 600px at 92% 4%, rgba(245,184,61,0.08), transparent 55%),
        #0a0b12;}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:#1a1a1a}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
    .drawer-slide{animation:slideIn .28s cubic-bezier(.16,1,.3,1)}
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    .fade-in{animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .measure-bar-fill{transition:width .6s cubic-bezier(.16,1,.3,1)}
    .signal-pulse{animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
    .score-ring{transform:rotate(-90deg);transform-origin:center}
    /* NEW card hover */
    .plan-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative}
    .plan-card:hover{transform:scale(1.025);box-shadow:0 12px 48px rgba(0,0,0,0.7);z-index:2;cursor:pointer}
    /* Netflix row */
    .netflix-row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
    .netflix-row::-webkit-scrollbar{display:none}
    .netflix-row{-ms-overflow-style:none;scrollbar-width:none}
    /* tooltip */
    .tooltip{position:relative}
    .tooltip:hover .tooltip-box{display:block}
    .tooltip-box{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#1e1e1e;border:1px solid rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px;font-size:11px;color:#94a3b8;z-index:100;min-width:220px;white-space:normal}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Drill-down redesign */
    .pick-row{transition:background .14s ease,border-color .14s ease}
    .pick-row:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.18);cursor:pointer}
    .drill-row{transition:background .14s ease}
    .drill-row:hover{background:rgba(255,255,255,0.04);cursor:pointer}
    .cmp-table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
    .cmp-table th,.cmp-table td{padding:9px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap}
    .cmp-table th{position:sticky;top:0;background:#161616;z-index:3;font-weight:600;color:#94a3b8;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
    .cmp-sticky{position:sticky;left:0;background:#141414;z-index:2;text-align:left;min-width:230px}
    .cmp-table th.cmp-sticky{z-index:4;background:#161616}
    .cmp-beat{background:rgba(34,197,94,0.13)}
    .cmp-anchor{background:rgba(59,130,246,0.10)}
    .cmp-anchor .cmp-sticky{background:rgba(59,130,246,0.14)}
    /* ── Landing page ─────────────────────────────────────── */
    .lp-grad-text{background:linear-gradient(120deg,#fff 0%,#c9c3ff 45%,#f5b83d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .lp-cta{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 12px 40px -8px rgba(124,108,246,0.6);transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s ease}
    .lp-cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 20px 60px -10px rgba(124,108,246,0.8)}
    .lp-cta:active{transform:translateY(0) scale(.99)}
    .lp-glass{background:linear-gradient(180deg,rgba(255,255,255,0.045),rgba(255,255,255,0.02));border:1px solid var(--line);backdrop-filter:blur(12px)}
    .lp-rise{animation:lpRise .7s cubic-bezier(.16,1,.3,1) both}
    @keyframes lpRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
    .lp-d1{animation-delay:.06s}.lp-d2{animation-delay:.14s}.lp-d3{animation-delay:.22s}.lp-d4{animation-delay:.3s}.lp-d5{animation-delay:.4s}
    .lp-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:lpFloat 14s ease-in-out infinite}
    @keyframes lpFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-24px)}}
    .lp-star{animation:lpTwinkle 3.2s ease-in-out infinite}
    @keyframes lpTwinkle{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
    .lp-badge{background:var(--gold-soft);border:1px solid rgba(245,184,61,0.32);color:var(--gold)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

/* ── CMS 2026 Call-Center Measures ───────────────────────── */
const CC_MEASURES = [
  {id:'C22',label:'Getting Needed Care (CAHPS)',
   desc:'Members ability to get necessary care and referrals. Call center navigation support directly impacts authorization and referral access.'},
  {id:'C23',label:'Getting Appointments & Care Quickly (CAHPS)',
   desc:'Speed of access to care. Call center scheduling and care coordination are primary drivers.'},
  {id:'C24',label:'Customer Service (CAHPS)',
   desc:'Direct CAHPS measure of member experience when calling the plan. Highest-leverage, most direct call center quality measure in the Star program.'},
  {id:'C28',label:'Complaints about the Health Plan',
   desc:'Plan-level complaint rate from CMS complaints database. High complaints reflect poor first-call resolution.'},
  {id:'C29',label:'Members Choosing to Leave the Plan',
   desc:'Voluntary disenrollment rate. CMS exit surveys cite "difficulty reaching the plan" as the #1 reason members leave.'},
  {id:'C31',label:'Plan Makes Timely Decisions on Appeals',
   desc:'Appeals timeliness compliance. Call center is first point of contact for all member appeals and grievances.'},
  {id:'C33',label:'Call Center Language Access — Part C (Audit)',
   desc:'CMS audit measure: availability of language interpreters and TTY/TDD on Part C inbound calls. A direct call center audit.'},
  {id:'D01',label:'Call Center Language Access — Part D (Audit)',
   desc:'CMS audit measure: language interpreter and TTY access on Part D pharmacy calls. Separate audit from C33.'},
  {id:'D02',label:'Part D Complaints Rate',
   desc:'Drug plan complaint rate. Often driven by pharmacy call center first-call resolution failures.'},
  {id:'D03',label:'Members Leaving the Drug Plan',
   desc:'Part D voluntary disenrollment. Poor member service on pharmacy calls is a primary driver.'},
];

/* CAHPS = member-reported experience; OPS = operational call-center measures */
const CAHPS_IDS = ['C22','C23','C24'];
const OPS_IDS   = ['C28','C29','C31','C33','D01'];
const MEASURE_SHORT = {C22:'Getting Needed Care',C23:'Appts & Care Quickly',C24:'Customer Service',C28:'Complaints',C29:'Disenrollment',C31:'Appeals Timeliness',C33:'Lang Access · C',D01:'Lang Access · D'};

/* ── Signal Config ───────────────────────────────────────── */
const SIG = {
  star_drop:          {label:'Star Drop',        bg:'bg-orange-500/15',text:'text-orange-400',border:'border-orange-500/30',dot:'#f97316',icon:'↓★'},
  low_performer:      {label:'Low Performer',    bg:'bg-red-600/15',   text:'text-red-400',   border:'border-red-500/40',   dot:'#dc2626',icon:'⚠'},
  language_gap:       {label:'Language Gap',     bg:'bg-purple-500/15',text:'text-purple-400',border:'border-purple-500/30',dot:'#a855f7',icon:'🌐'},
  cc_weakness:        {label:'CC Quality Gap',   bg:'bg-yellow-500/15',text:'text-yellow-400',border:'border-yellow-500/30',dot:'#eab308',icon:'📞'},
  complaint_surge:    {label:'High Complaints',  bg:'bg-yellow-600/15',text:'text-yellow-400',border:'border-yellow-500/30',dot:'#ca8a04',icon:'📢'},
  disenrollment_spike:{label:'Disenrollment ↑',  bg:'bg-orange-600/15',text:'text-orange-400',border:'border-orange-500/30',dot:'#ea580c',icon:'🚪'},
  appeals_risk:       {label:'Appeals Risk',     bg:'bg-red-500/15',   text:'text-red-400',   border:'border-red-500/30',   dot:'#ef4444',icon:'⚖'},
};

const SCENARIOS = {
  recovery:   {label:'Recovery Play',  color:'#ef4444',icon:'🔄',desc:'Plan lost stars/QBP — urgency to recover bonus payments'},
  turnaround: {label:'Turnaround Play',color:'#dc2626',icon:'🆘',desc:'Persistent low performer — below 3.0★, CMS sanction risk'},
  language:   {label:'Language Play',  color:'#a855f7',icon:'🌐',desc:'Failed language access audit — addressable with specialized workforce'},
  compliance: {label:'Compliance Play',color:'#f97316',icon:'⚖', desc:'Appeals/grievances deficiency — compliance-driven urgency'},
  expansion:  {label:'Expansion Play', color:'#22c55e',icon:'🗺', desc:'High-performing plan entering new markets or scaling'},
};

/* ── Utilities ───────────────────────────────────────────── */
const fmt  = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'K':String(n);
const fmtD = n => n>=1e9?'$'+(n/1e9).toFixed(1)+'B':n>=1e6?'$'+(n/1e6).toFixed(0)+'M':'$'+n.toLocaleString();

function oppColor(v){
  if(v>=65) return '#ef4444';
  if(v>=50) return '#f97316';
  if(v>=35) return '#eab308';
  if(v>=20) return '#84cc16';
  return '#22c55e';
}
function oppLabel(v){
  if(v>=65) return 'CRITICAL';
  if(v>=50) return 'HIGH';
  if(v>=35) return 'MEDIUM';
  if(v>=20) return 'MONITOR';
  return 'LOW';
}
function starColor(v){
  if(v>=4.5) return '#10b981';
  if(v>=4.0) return '#22c55e';
  if(v>=3.5) return '#84cc16';
  if(v>=3.0) return '#eab308';
  if(v>=2.5) return '#f97316';
  return '#ef4444';
}
function accentFromName(name){
  const colors=['#3b82f6','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#6366f1'];
  let h=0; for(let c of name) h=(h*31+c.charCodeAt(0))&0xffffffff;
  return colors[Math.abs(h)%colors.length];
}
function tierLabel(enr){
  if(enr>=1e6)  return {label:'ENTERPRISE', color:'#8b5cf6'};
  if(enr>=200e3) return {label:'MID-MARKET', color:'#3b82f6'};
  return              {label:'REGIONAL',   color:'#22c55e'};
}
function cahpsAvg(p){
  const v = CAHPS_IDS.map(id=>p.measures?.[id]).filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
/* Call-center composite: mean of the 8 CAHPS + operational measures shown in the drill table. */
function ccComposite(p){
  const ids = ['C22','C23','C24','C28','C29','C31','C33','D01'];
  const v = ids.map(id=>p.measures?.[id]).filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
/* Prior-year (2025) call-center composite over the same 8 measures, re-keyed to 2026 codes.
   CMS renumbered measure codes between 2025 and 2026; the pipeline already name-matched them,
   so measures2025[C24] is the SAME underlying measure as measures[C24]. */
function ccComposite2025(p){
  const ids = ['C22','C23','C24','C28','C29','C31','C33','D01'];
  const v = ids.map(id=>p.measures2025?.[id]).filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
/* Newest-year (2027) call-center composite over the same 8 measures (name-matched). */
function ccComposite2027(p){
  const ids = ['C22','C23','C24','C28','C29','C31','C33','D01'];
  const v = ids.map(id=>p.measures2027?.[id]).filter(x=>x!=null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
/* Signed YoY color: up = green (improved), down = red (declined), flat = slate. */
function deltaColor(d){ return d>0 ? '#22c55e' : d<0 ? '#ef4444' : '#64748b'; }
/* Small YoY delta chip. `delta` is 2026 − 2025 in stars. Renders nothing when null (new/not-rated). */
const DeltaChip = ({delta, suffix='', size='xs'}) => {
  if(delta==null) return <span className="text-slate-600" style={{fontSize:9}}>new</span>;
  const c=deltaColor(delta);
  const arrow = delta>0?'▲':delta<0?'▼':'→';
  const txt = delta===0 ? 'flat' : `${delta>0?'+':''}${delta.toFixed(1)}`;
  return <span className={`text-${size} font-semibold inline-flex items-center gap-0.5`} style={{color:c}}>{arrow} {txt}{suffix}</span>;
};
/* North Star = the aspirational ceiling in a pool. Ranked purely on CMS published numbers:
   2026 Overall ★ → CAHPS avg → call-center composite → reach (enrollment). No invented weighting.
   Must have reported CAHPS data — a benchmark on the very measures we compare, never an empty "N/A" plan. */
function pickNorthStar(pool, anchorId){
  const cand = pool.filter(p=>p.id!==anchorId && p.overall2026!=null && cahpsAvg(p)!=null);
  if(!cand.length) return null;
  cand.sort((a,b)=>
    (b.overall2026-a.overall2026) ||
    ((cahpsAvg(b)||0)-(cahpsAvg(a)||0)) ||
    ((ccComposite(b)||0)-(ccComposite(a)||0)) ||
    (b.enrollment-a.enrollment)
  );
  return cand[0];
}

/* ── Logo domain map ─────────────────────────────────────── */
const LOGO_DOMAINS = {
  'unitedhealthcare':'unitedhealthcare.com','optum':'optum.com',
  'humana':'humana.com',
  'aetna':'aetna.com','cvs health':'cvs.com',
  'kaiser':'kaiserpermanente.org',
  'centene':'centene.com','wellcare':'wellcare.com','sunshine health':'sunshinehealth.com',
  'molina':'molinahealthcare.com',
  'cigna':'cigna.com','evernorth':'evernorth.com',
  'elevance':'elevancehealth.com','anthem':'elevancehealth.com',
  'scan health':'scanhealthplan.com',
  'clover':'cloverhealth.com',
  'oscar':'hioscar.com',
  'devoted':'devoted.com',
  'alignment':'alignmenthealthcare.com',
  'caresource':'caresource.com',
  'highmark':'highmark.com','geisinger':'geisinger.org',
  'independence blue':'ibx.com','regence':'regence.com',
  'medica':'medica.com','healthpartners':'healthpartners.com',
  'zing health':'zinghealth.com',
  'health care service':'hcsc.com','bcbsm':'bcbsm.com',
  'florida blue':'floridablue.com','blue shield of california':'blueshieldca.com',
};
function getLogoDomain(orgName, parentOrg) {
  const text = (orgName+' '+parentOrg).toLowerCase();
  for(const [k,d] of Object.entries(LOGO_DOMAINS)) if(text.includes(k)) return d;
  return null;
}

/* ── LogoImg ─────────────────────────────────────────────── */
const LogoImg = ({plan, size=46}) => {
  const [err, setErr] = useState(false);
  const domain = getLogoDomain(plan.orgName, plan.parentOrg);
  const accent = accentFromName(plan.orgName);
  const initial = plan.orgName.charAt(0).toUpperCase();
  const r = Math.round(size*0.22);
  if(!domain||err) return (
    <div style={{width:size,height:size,background:accent+'28',border:`1.5px solid ${accent}50`,color:accent,fontSize:size*0.42,borderRadius:r,flexShrink:0}}
      className="flex items-center justify-center font-black">{initial}</div>
  );
  return <img src={`https://logo.clearbit.com/${domain}?size=${size*2}`} onError={()=>setErr(true)}
    style={{width:size,height:size,borderRadius:r,objectFit:'contain',background:'#fff',padding:3,flexShrink:0}} alt={plan.orgName}/>;
};

/* ── Sub-components ─────────────────────────────────────── */
const StarDots = ({value, size=13}) => {
  if(!value) return <span className="text-slate-600 text-xs">N/A</span>;
  const c = starColor(value);
  return (
    <span className="inline-flex items-center gap-0.5">
      {[1,2,3,4,5].map(i=>{
        const fill = i<=Math.floor(value)?1:(i-value<1&&i>Math.floor(value))?(value%1):0;
        return (
          <svg key={i} width={size} height={size} viewBox="0 0 24 24">
            <defs><linearGradient id={`sg${i}${value}`}>
              <stop offset={fill*100+'%'} stopColor={c}/>
              <stop offset={fill*100+'%'} stopColor="#374151"/>
            </linearGradient></defs>
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
              fill={`url(#sg${i}${value})`}/>
          </svg>
        );
      })}
      <span style={{color:c,fontSize:size-1}} className="font-bold ml-0.5">{value.toFixed(1)}</span>
    </span>
  );
};

const OppRing = ({score, size=46}) => {
  const r=(size/2)-5, circ=2*Math.PI*r, offset=circ-(score/100)*circ, c=oppColor(score);
  return (
    <div style={{width:size,height:size}} className="relative flex items-center justify-center flex-shrink-0">
      <svg width={size} height={size} className="score-ring absolute">
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e2538" strokeWidth="4.5"/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={c} strokeWidth="4.5"
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
          style={{transition:'stroke-dashoffset .7s cubic-bezier(.16,1,.3,1)'}}/>
      </svg>
      <div className="text-center z-10">
        <div className="font-bold leading-none" style={{color:c,fontSize:size>52?15:11}}>{score}</div>
        <div className="text-slate-600 leading-none" style={{fontSize:8}}>OPP</div>
      </div>
    </div>
  );
};

const SignalBadge = ({type, small=false}) => {
  const s=SIG[type]; if(!s) return null;
  return (
    <span className={`inline-flex items-center gap-1 rounded-full px-2 ${small?'py-0.5':'py-1'} text-xs font-medium ${s.bg} ${s.text} border ${s.border}`}>
      <span>{s.icon}</span>{s.label}
    </span>
  );
};

/* YearCell — one year's star value, color-coded. Dimmed label, bold value. */
const YearCell = ({yr, val}) => val==null
  ? <span className="tabular-nums" style={{fontSize:10,color:'#4b4b5e'}}>{yr} —</span>
  : <span className="tabular-nums" style={{fontSize:10,color:'#707590'}}>{yr} <span style={{color:starColor(val),fontWeight:700}}>{val.toFixed(1)}</span></span>;

const MeasureBar = ({measure, v25=null, v26=null, v27=null}) => {
  // Bar reflects the newest available year; newest step delta = 2027 − 2026.
  const latest = v27!=null ? v27 : v26;
  const stepDelta = (v27!=null && v26!=null) ? +(v27-v26).toFixed(1) : null;
  if(latest==null) return (
    <div className="flex items-center gap-3 py-2 border-b border-white/5">
      <span className="text-xs font-mono text-slate-600">{measure.id}</span>
      <span className="text-xs text-slate-500 truncate flex-1">{measure.label}</span>
      <span className="text-xs text-slate-600 ml-2">Not rated</span>
    </div>
  );
  const pct=(latest/5)*100, c=starColor(latest);
  const traj = [['2025',v25],['2026',v26],['2027',v27]].filter(x=>x[1]!=null).map(x=>`${x[0]}: ${x[1].toFixed(1)}★`).join(' → ');
  return (
    <div className="tooltip">
      <div className="flex items-center gap-2 py-2.5 border-b border-white/5">
        <span className="text-xs font-mono text-slate-500 flex-shrink-0 w-7">{measure.id}</span>
        <div className="flex-1 min-w-0">
          <div className="flex items-center justify-between mb-1 gap-2">
            <span className="text-xs text-slate-300 truncate">{measure.label}</span>
            <span className="flex items-center gap-2 flex-shrink-0">
              <YearCell yr="'25" val={v25}/>
              <YearCell yr="'26" val={v26}/>
              <YearCell yr="'27" val={v27}/>
              <DeltaChip delta={stepDelta}/>
            </span>
          </div>
          <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
            <div className="measure-bar-fill h-full rounded-full" style={{width:pct+'%',background:`linear-gradient(90deg,${c}99,${c})`}}/>
          </div>
        </div>
      </div>
      <div className="tooltip-box">{measure.desc}{traj?` · ${traj}`:''}</div>
    </div>
  );
};

/* ── Drawer Tabs ─────────────────────────────────────────── */
const OverviewTab = ({plan}) => {
  const diff = plan.overall2025 ? plan.overall2026 - plan.overall2025 : null;
  const t = tierLabel(plan.enrollment);
  return (
    <div className="fade-in space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <div className="bg-slate-800/60 rounded-xl p-4 border border-white/5">
          <div className="text-slate-500 text-xs mb-1">Enrollment (May 2025)</div>
          <div className="text-2xl font-bold text-white">{fmt(plan.enrollment)}</div>
          <div className="text-xs mt-1 font-semibold" style={{color:t.color}}>{t.label}</div>
        </div>
        <div className="bg-slate-800/60 rounded-xl p-4 border border-white/5">
          <div className="text-slate-500 text-xs mb-1">Overall Stars {plan.overall2027!=null?'(2027)':'(2026)'}</div>
          <div className="mt-1"><StarDots value={plan.overall2027!=null?plan.overall2027:plan.overall2026} size={15}/></div>
          <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
            <YearCell yr="'25" val={plan.overall2025??null}/>
            <span style={{color:'#4b4b5e'}}>→</span>
            <YearCell yr="'26" val={plan.overall2026??null}/>
            <span style={{color:'#4b4b5e'}}>→</span>

const footprintOf = p => p.states.length>=5?'national':(p.states.length>=2?'regional':'single');
const FOOTPRINT_LABEL = {national:'National (5+ states)', regional:'Regional (2-4 states)', single:'Single state'};

const DrillView = ({anchor, allPlans, onBack, onOpen}) => {
  const [stateFilter, setStateFilter] = useState(null);
  const [sizeFilter, setSizeFilter] = useState(null);      // 'similar' | 'larger' | 'smaller'
  const [footprint, setFootprint] = useState(null);        // 'national' | 'regional' | 'single'
  const sizeLo = Math.round(anchor.enrollment*0.5);
  const sizeHi = Math.round(anchor.enrollment*1.5);
  const anchorFootprint = footprintOf(anchor);
  const inMarketStar = useMemo(()=>pickNorthStar(allPlans.filter(p=>p.states.some(s=>anchor.states.includes(s))), anchor.id),[allPlans,anchor]);
  const nationalStar = useMemo(()=>pickNorthStar(allPlans, anchor.id),[allPlans,anchor]);
  const sameStar = inMarketStar && nationalStar && inMarketStar.id===nationalStar.id;
  const peers = useMemo(()=>{
    return allPlans
      .filter(p=>p.id!==anchor.id && p.states.some(s=>anchor.states.includes(s)))
      .filter(p=>!stateFilter || p.states.includes(stateFilter))
      .filter(p=>{
        if(!sizeFilter) return true;
        if(sizeFilter==='similar') return p.enrollment>=sizeLo && p.enrollment<=sizeHi;
        if(sizeFilter==='larger')  return p.enrollment>sizeHi;
        if(sizeFilter==='smaller') return p.enrollment<sizeLo;
        return true;
      })
      .filter(p=>!footprint || footprintOf(p)===footprint)
      .sort((a,b)=>(b.overall2026-a.overall2026)||(b.enrollment-a.enrollment));
  },[anchor,allPlans,stateFilter,sizeFilter,footprint,sizeLo,sizeHi]);
  const anyFilter = !!(stateFilter||sizeFilter||footprint);
  const anchorCahps = cahpsAvg(anchor);
  const rows = [anchor, ...peers];
  const ALL_IDS = [...CAHPS_IDS, ...OPS_IDS];
  return (
    <div className="px-6 py-6 fade-in">
      <button onClick={onBack} className="text-slate-400 hover:text-white text-sm mb-4 flex items-center gap-1.5">← Choose a different plan</button>

      {/* Anchor header */}
      <div className="rounded-xl border border-blue-500/25 p-5 mb-5 flex items-center gap-4" style={{background:'linear-gradient(90deg,rgba(59,130,246,0.10),#161616)'}}>
        <LogoImg plan={anchor} size={56}/>
        <div className="flex-1 min-w-0">
          <div className="text-xs text-blue-300 font-semibold uppercase tracking-wider mb-0.5">Drilling into</div>
          <div className="text-white font-bold text-xl truncate">{anchor.orgName}</div>
          <div className="text-slate-500 text-xs mt-0.5">{anchor.id} · {anchor.parentOrg||'—'} · {fmt(anchor.enrollment)} members · Serves {anchor.states.join(', ')}</div>
        </div>
        <div className="text-center flex-shrink-0">
          <div className="text-xs text-slate-500 mb-1">2026 Overall</div>
          <StarDots value={anchor.overall2026} size={15}/>
          <div className="text-xs text-slate-500 mt-1">CAHPS avg {anchorCahps!=null?anchorCahps.toFixed(2):'N/A'}</div>
        </div>
      </div>

      {/* North Star — the aspirational ceiling */}
      {(inMarketStar||nationalStar) && (
        <div className="mb-5">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-lg">🌟</span>
            <span className="text-white font-bold text-base">North Star — what "best-in-class" looks like</span>
          </div>
          <div className="text-slate-500 text-xs mb-3">
            The highest-rated plans by CMS 2026 Overall Star, then CAHPS avg, then call-center composite. This is the ceiling {anchor.orgName} can aim for — the perspective on what's achievable.
          </div>
          {sameStar ? (
            <div>
              <NorthStarCard plan={nationalStar} anchor={anchor} onOpen={onOpen}
                label="Leads your market AND the nation" icon="🌟" accent="#f59e0b"/>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              <NorthStarCard plan={inMarketStar} anchor={anchor} onOpen={onOpen}
                label="Best in your markets" icon="📍" accent="#3b82f6"/>
              <NorthStarCard plan={nationalStar} anchor={anchor} onOpen={onOpen}
                label="Best in the nation" icon="🌐" accent="#f59e0b"/>
            </div>
          )}
        </div>
      )}

      {/* Shared-state filter chips */}
      <div className="flex items-center gap-2 flex-wrap mb-4">
        <span className="text-xs text-slate-500 uppercase tracking-wider mr-1">Shared states:</span>
        <button onClick={()=>setStateFilter(null)}
          className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${!stateFilter?'text-white border-blue-500/60':'text-slate-500 border-slate-700 hover:text-slate-300'}`}
          style={!stateFilter?{background:'rgba(59,130,246,0.20)'}:{}}>All ({anchor.states.length})</button>
        {anchor.states.map(st=>(
          <button key={st} onClick={()=>setStateFilter(st===stateFilter?null:st)}
            className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${stateFilter===st?'text-white border-blue-500/60':'text-slate-500 border-slate-700 hover:text-slate-300'}`}
            style={stateFilter===st?{background:'rgba(59,130,246,0.20)'}:{}}>{st}</button>
        ))}
      </div>

      {/* Size filter chips */}
      <div className="flex items-center gap-2 flex-wrap mb-2">
        <span className="text-xs text-slate-500 uppercase tracking-wider mr-1">Plan size:</span>
        <button onClick={()=>setSizeFilter(null)}
          className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${!sizeFilter?'text-white border-blue-500/60':'text-slate-500 border-slate-700 hover:text-slate-300'}`}
          style={!sizeFilter?{background:'rgba(59,130,246,0.20)'}:{}}>Any size</button>
        {[['similar',`Similar size (${fmt(sizeLo)}–${fmt(sizeHi)})`],['smaller',`Smaller (< ${fmt(sizeLo)})`],['larger',`Larger (> ${fmt(sizeHi)})`]].map(([v,l])=>(
          <button key={v} onClick={()=>setSizeFilter(v===sizeFilter?null:v)}
            title={`Compared against ${anchor.orgName}'s ${fmt(anchor.enrollment)} members (±50%)`}
            className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${sizeFilter===v?'text-white border-emerald-500/60':'text-slate-500 border-slate-700 hover:text-slate-300'}`}
            style={sizeFilter===v?{background:'rgba(16,185,129,0.20)'}:{}}>{l}</button>
        ))}
      </div>

      {/* Footprint filter chips */}
      <div className="flex items-center gap-2 flex-wrap mb-4">
        <span className="text-xs text-slate-500 uppercase tracking-wider mr-1">Footprint:</span>
        <button onClick={()=>setFootprint(null)}
          className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${!footprint?'text-white border-blue-500/60':'text-slate-500 border-slate-700 hover:text-slate-300'}`}
          style={!footprint?{background:'rgba(59,130,246,0.20)'}:{}}>Any footprint</button>
        {['national','regional','single'].map(v=>(
          <button key={v} onClick={()=>setFootprint(v===footprint?null:v)}
            className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${footprint===v?'text-white border-amber-500/60':'text-slate-500 border-slate-700 hover:text-slate-300'}`}
            style={footprint===v?{background:'rgba(245,158,11,0.20)'}:{}}>
            {FOOTPRINT_LABEL[v]}{v===anchorFootprint && <span className="text-blue-300 ml-1">· like you</span>}
          </button>
        ))}
        {anyFilter && <button onClick={()=>{setStateFilter(null);setSizeFilter(null);setFootprint(null);}}

      <div className="text-sm text-slate-400 mb-2">

        <table className="cmp-table">

            <tr>
              <th className="cmp-sticky">Plan</th>
              <th>Overall ★</th>
              <th>CAHPS avg</th>

              {OPS_IDS.map(id=><th key={id} title={MEASURE_SHORT[id]}>{id}<div style={{fontWeight:400,textTransform:'none',letterSpacing:0}} className="text-slate-600">{MEASURE_SHORT[id]}</div></th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map(p=>{
              const isAnchor = p.id===anchor.id;
              const pc = cahpsAvg(p);
              return (
                <tr key={p.id} onClick={()=>onOpen(p)} className={`drill-row ${isAnchor?'cmp-anchor':''}`}>
                  <td className="cmp-sticky">
                    <div className="flex items-center gap-2.5">

                      <div className="min-w-0">

                        <div className="text-slate-600 text-xs flex items-center gap-1.5">

                      </div>

                  <td>{pc!=null?<span style={{color:starColor(pc)}} className="font-semibold">{pc.toFixed(2)}{!isAnchor&&anchorCahps!=null&&pc>anchorCahps&&<span className="text-green-400 ml-1">▲</span>}</span>:<span className="text-slate-600">–</span>}</td>
                  {ALL_IDS.map(id=>(
                    isAnchor
                      ? <td key={id}>{p.measures?.[id]!=null?<span style={{color:starColor(p.measures[id])}} className="font-semibold">{p.measures[id].toFixed(1)}</span>:<span className="text-slate-600">–</span>}</td>
                      : <CmpCell key={id} val={p.measures?.[id]} anchorVal={anchor.measures?.[id]}/>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Signals driving the anchor's scores */}
      <div className="mb-2">
        <div className="text-white font-bold text-lg mb-1">Signals driving {anchor.orgName}'s scores</div>

      </div>
      {anchor.signals?.length ? (
        <div className="grid grid-cols-2 gap-3">
          {anchor.signals.map((s,i)=>{

            return (
              <div key={i} className={`rounded-xl p-4 border ${cfg.border||'border-white/10'}`} style={{background:'#161616'}}>
                <div className="flex items-center gap-2 mb-1.5">
                  <SignalBadge type={s.type}/>

                <div className="text-white font-semibold text-sm mb-1">{s.headline}</div>

            );

      ) : <div className="text-slate-500 text-sm rounded-xl p-4 border border-white/5" style={{background:'#161616'}}>No signals flagged for this plan — its measures are within normal ranges.</div>}
    </div>
  );
};

    <div className="grid grid-cols-5 gap-3 px-5 py-3" style={{background:'#111'}}>

/* ── Landing Page (Russell Brunson-style) ────────────────── */
const Star = ({size=16,color='var(--gold)',cls=''}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={color} className={cls}><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 7.1-1.01L12 2z"/></svg>
);

const Landing = ({plans, loading, onEnter}) => {
  const stats = useMemo(()=>{
    if(!plans?.length) return {plans:'900+',critical:'120+',members:'33M+',states:'50'};
    const critical = plans.filter(p=>p.opportunityScore>=65).length;
    const members  = plans.reduce((a,p)=>a+(p.enrollment||0),0);
    const states   = new Set(plans.flatMap(p=>p.states||[])).size;
    return {
      plans:  plans.length.toLocaleString(),
      critical: critical.toLocaleString(),
      members: members>=1e6?(members/1e6).toFixed(0)+'M':fmt(members),
      states: String(states),
    };
  },[plans]);

/* Mini sparkline for a 3-point star trajectory (values 0–5). */
const Spark = ({pts, w=46, h=16}) => {
  const vals = pts.filter(v=>v!=null);
  if(vals.length<2) return <span style={{display:'inline-block',width:w}}/>;
  const xs = pts.map((v,i)=>pts.length>1?(i/(pts.length-1))*(w-2)+1:w/2);
  const y = v => h-2 - (v/5)*(h-4);
  const seg = [];
  let prev=null;
  pts.forEach((v,i)=>{ if(v!=null){ if(prev!=null) seg.push(`${xs[prev]},${y(pts[prev])} ${xs[i]},${y(v)}`); prev=i; } });
  const last = [...pts].reverse().find(v=>v!=null);
  const first = pts.find(v=>v!=null);
  const col = deltaColor(last-first);
  return (
    <svg width={w} height={h} style={{flexShrink:0}}>
      {seg.map((s,i)=><polyline key={i} points={s} fill="none" stroke={col} strokeWidth="1.5" strokeLinecap="round"/>)}
      {pts.map((v,i)=>v!=null?<circle key={i} cx={xs[i]} cy={y(v)} r="1.6" fill={col}/>:null)}
    </svg>
  );
};

const MoverRow = ({plan, isSelected, onOpen}) => {

const MoversView = ({plans, selected, onOpen}) => {
  // Newest-step movers: plans with both 2026 and 2027 CC composite. Rank by 2026 → 2027 change.
  const movers = useMemo(()=>plans
    .filter(p=>p.ccAvg!=null && p.ccAvg2027!=null)
    .map(p=>({...p, step:+(p.ccAvg2027-p.ccAvg).toFixed(2)})), [plans]);

  const decliners = useMemo(()=>[...movers].sort((a,b)=>a.step-b.step).slice(0,12), [movers]);
  const improvers = useMemo(()=>[...movers].sort((a,b)=>b.step-a.step).slice(0,12), [movers]);

  const summary = useMemo(()=>({
    n: movers.length,
    imp: movers.filter(m=>m.step>0).length,
    dec: movers.filter(m=>m.step<0).length,
    flat: movers.filter(m=>m.step===0).length,
  }), [movers]);

  // Per-measure market movement across all three cycles. Mean per year uses plans reporting
  // that measure that year; newest net (26→27) uses plans reporting both years.
  const measureStats = useMemo(()=>CC_MEASURES.map(m=>{
    const mean = key => { let s=0,n=0; plans.forEach(p=>{const v=p[key]?.[m.id]; if(v!=null){s+=v;n++;}}); return n?{avg:s/n,n}:{avg:null,n:0}; };
    const a25=mean('measures2025'), a26=mean('measures'), a27=mean('measures2027');
    let s=0,nn=0,imp=0,dec=0;
    plans.forEach(p=>{const b=p.measures?.[m.id], c=p.measures2027?.[m.id]; if(b!=null&&c!=null){s+=(c-b);nn++; const dd=c-b; if(dd>0.0001)imp++; else if(dd<-0.0001)dec++;}});
    return {id:m.id,label:m.label,avg25:a25.avg,avg26:a26.avg,avg27:a27.avg,net:nn?s/nn:null,imp,dec,n:nn};
  }).filter(x=>x.n>0).sort((a,b)=>a.net-b.net), [plans]);

  return (
    <div className="px-6 py-6 max-w-6xl mx-auto">
      <div className="mb-5">
        <h2 className="text-xl font-bold text-white">Call-Center Measure Trends — 2025 → 2026 → 2027</h2>
        <p className="text-sm mt-1" style={{color:'#9095b5'}}>
          Three-cycle movement across the 10 call-center-linked CMS Star measures. Rankings and the summary below reflect the <span className="font-semibold">newest change (2026 → 2027)</span> for {summary.n} plans with data in both years.
          CMS renumbered measure codes each year — every comparison is name-matched to the <span className="font-semibold">same underlying measure</span>. All values are official CMS published stars.
        </p>
      </div>

      {/* Market summary band (newest step) */}
      <div className="grid grid-cols-4 gap-3 mb-6">
        {[
          {label:'Plans Compared', val:summary.n, color:'#8b5cf6', sub:'2026 & 2027 CC data'},
          {label:'CC Composite ▲ Improved', val:summary.imp, color:'#22c55e', sub:'Higher vs 2026'},
          {label:'CC Composite ▼ Declined', val:summary.dec, color:'#ef4444', sub:'Lower vs 2026'},
          {label:'Flat', val:summary.flat, color:'#64748b', sub:'No net change'},
        ].map((c,i)=>(
          <div key={i} className="rounded-xl p-4 border" style={{background:'#15151f',borderColor:'rgba(255,255,255,0.06)'}}>
            <div className="text-xs mb-1" style={{color:'#808080'}}>{c.label}</div>
            <div className="text-2xl font-bold" style={{color:c.color}}>{c.val}</div>
            <div className="text-xs mt-1" style={{color:'#606060'}}>{c.sub}</div>
          </div>
        ))}
      </div>

      {/* Per-measure market movement (3 cycles) */}
      <div className="rounded-xl border mb-6 overflow-hidden" style={{borderColor:'rgba(255,255,255,0.06)'}}>
        <div className="px-4 py-3 border-b" style={{background:'#15151f',borderColor:'rgba(255,255,255,0.06)'}}>
          <div className="text-sm font-semibold text-white">Market-Wide Movement by Measure</div>
          <div className="text-xs mt-0.5" style={{color:'#808080'}}>Mean star per cycle across reporting plans, sorted by steepest newest decline. Net Δ = 2027 mean − 2026 mean.</div>
        </div>
        <div style={{background:'#111119'}}>
          {measureStats.map(m=>{
            const w = Math.min(100, Math.abs(m.net)/1.0*100); // scale: 1.0★ net = full bar
            return (
              <div key={m.id} className="flex items-center gap-3 px-4 py-2.5 border-b" style={{borderColor:'rgba(255,255,255,0.05)'}}>
                <span className="text-xs font-mono flex-shrink-0 w-8" style={{color:'#808080'}}>{m.id}</span>
                <span className="text-xs text-slate-300 flex-1 min-w-0 truncate">{m.label}</span>
                <span className="text-xs tabular-nums flex-shrink-0 hidden md:inline" style={{color:'#9095b5',width:116,textAlign:'right'}}>
                  {m.avg25!=null?m.avg25.toFixed(2):'—'} → {m.avg26!=null?m.avg26.toFixed(2):'—'} → {m.avg27!=null?m.avg27.toFixed(2):'—'}

      .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
      .then(data=>{setAllPlans(data); setLoading(false);})
      .catch(e=>{setError(e.message); setLoading(false);});
  },[]);

  const allStates = useMemo(()=>[...new Set(allPlans.flatMap(p=>p.states))].sort(),[allPlans]);

  const filtered = useMemo(()=>{
    let r = allPlans.filter(p=>{
      if(filters.search){
        const q=filters.search.toLowerCase();
        if(!p.orgName.toLowerCase().includes(q)&&!p.parentOrg.toLowerCase().includes(q)&&!p.id.toLowerCase().includes(q)) return false;
      }
      if(filters.minOpp!=null && p.opportunityScore<filters.minOpp) return false;
      if(filters.stars){
        if(filters.stars==='low'  && p.overall2026>2.5)  return false;
        if(filters.stars==='high' && p.overall2026<4.0)  return false;
        if(filters.stars==='3.0'  && p.overall2026!==3.0) return false;
        if(filters.stars==='3.5'  && p.overall2026!==3.5) return false;
      }
      if(filters.tier){
        const e=p.enrollment;
        if(filters.tier==='enterprise' && e<1e6)          return false;
        if(filters.tier==='midmarket'  && (e<200e3||e>=1e6)) return false;
        if(filters.tier==='regional'   && e>=200e3)       return false;
      }
      if(filters.change){
        const d=p.overall2025?p.overall2026-p.overall2025:null;
        if(filters.change==='drop'     && !(d!=null&&d<0))  return false;
        if(filters.change==='stable'   && !(d==null||d===0)) return false;
        if(filters.change==='improved' && !(d!=null&&d>0))  return false;
      }
      if(filters.signal && !p.signals?.some(s=>s.type===filters.signal)) return false;
      if(filters.state  && !p.states.includes(filters.state)) return false;
      if(filters.planType) {
        if(filters.planType==='hmo'  && !p.planTypes?.includes('hmo'))  return false;
        if(filters.planType==='ppo'  && !p.planTypes?.includes('ppo'))  return false;
        if(filters.planType==='pffs' && !p.planTypes?.includes('pffs')) return false;
      }
      if(filters.snp) {
        if(filters.snp==='dsnp' && !p.hasDSNP) return false;
        if(filters.snp==='csnp' && !p.hasCSNP) return false;
        if(filters.snp==='isnp' && !p.hasISNP) return false;
        if(filters.snp==='any'  && !p.hasSNP)  return false;
        if(filters.snp==='none' && p.hasSNP)   return false;
      }
      if(filters.blueCross && !p.isBlueCross) return false;
      if(filters.enrollMin!=null && p.enrollment < filters.enrollMin) return false;
      if(filters.enrollMax!=null && p.enrollment >= filters.enrollMax) return false;
      return true;
    });
    r.sort((a,b)=>{
      let va, vb;
      if(sortField==='opportunityScore'){va=a.opportunityScore;vb=b.opportunityScore;}
      else if(sortField==='enrollment'){va=a.enrollment;vb=b.enrollment;}
      else if(sortField==='overall2026'){va=a.overall2026;vb=b.overall2026;}
      else if(sortField==='ccAvg'){va=a.ccAvg||0;vb=b.ccAvg||0;}
      else if(sortField==='contractMax'){va=a.contractRange[1];vb=b.contractRange[1];}
      else{va=a.orgName;vb=b.orgName;}
      if(va<vb) return sortDir==='asc'?-1:1;
      if(va>vb) return sortDir==='asc'?1:-1;
      return 0;
    });
    return r;
  },[allPlans,filters,sortField,sortDir]);

  const paged = filtered.slice(0,(page)*PAGE_SIZE);
  const hasMore = paged.length < filtered.length;

  const toggleSort = f => {
    if(sortField===f) setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortField(f);setSortDir('desc');}
    setPage(1);
  };

  const SortTh = ({field, label, align='left', cls=''}) => (
    <th onClick={()=>toggleSort(field)}
      className={`px-3 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider cursor-pointer hover:text-slate-300 select-none text-${align} ${cls}`}>
      {label}{sortField===field?(sortDir==='desc'?' ↓':' ↑'):''}
    </th>
  );

  const isFiltered = !!(filters.search||filters.minOpp!=null||filters.stars||filters.tier||filters.change||filters.signal||filters.state||filters.planType||filters.snp||filters.blueCross||filters.enrollMin!=null);

  const netflixRows = useMemo(()=>[
    {id:'critical',icon:'🎯',title:'Critical Priority — Act Now',
      plans:allPlans.filter(p=>p.opportunityScore>=65).sort((a,b)=>b.opportunityScore-a.opportunityScore)},
    {id:'drop',icon:'📉',title:'Star Drops — Lost QBP Bonus',
      plans:allPlans.filter(p=>p.overall2025&&p.overall2026<p.overall2025).sort((a,b)=>b.enrollment-a.enrollment).slice(0,14)},
    {id:'dsnp',icon:'💊',title:'D-SNP — Dual Eligible Plans',
      plans:allPlans.filter(p=>p.hasDSNP).sort((a,b)=>b.opportunityScore-a.opportunityScore).slice(0,14)},
    {id:'cc',icon:'📞',title:'Call Center Quality Gap',
      plans:allPlans.filter(p=>p.signals?.some(s=>s.type==='cc_weakness')).sort((a,b)=>b.enrollment-a.enrollment).slice(0,14)},
    {id:'lang',icon:'🌐',title:'Language Access Audit Gap',
      plans:allPlans.filter(p=>p.signals?.some(s=>s.type==='language_gap')).sort((a,b)=>b.enrollment-a.enrollment).slice(0,14)},
    {id:'bcbs',icon:'🔵',title:'Blue Cross / BCBS Plans',
      plans:allPlans.filter(p=>p.isBlueCross).sort((a,b)=>b.opportunityScore-a.opportunityScore).slice(0,14)},
    {id:'ent',icon:'🏢',title:'Enterprise Accounts (1M+ Members)',
      plans:allPlans.filter(p=>p.enrollment>=1e6).sort((a,b)=>b.enrollment-a.enrollment)},
    {id:'all',icon:'📋',title:'All Plans by Opportunity Score',
      plans:allPlans.slice().sort((a,b)=>b.opportunityScore-a.opportunityScore).slice(0,14)},
  ],[allPlans]);

  if(view==='landing') return <Landing plans={allPlans} loading={loading} onEnter={()=>setView('drill')}/>;

  if(loading) return (
    <div className="min-h-screen flex items-center justify-center" style={{background:'transparent'}}>
      <div className="text-center">
        <div style={{width:48,height:48,border:'4px solid #23243a',borderTop:'4px solid var(--accent2)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} className="mb-4 mx-auto"/>
        <div className="text-white font-semibold text-lg">Loading CMS Data…</div>
        <div className="text-slate-500 text-sm mt-2">Fetching Medicare Advantage plans from CMS 2026 Star Ratings</div>
      </div>
    </div>
  );
  if(error) return (
    <div className="min-h-screen flex items-center justify-center" style={{background:'transparent'}}>
      <div className="text-center max-w-md">
        <div className="text-4xl mb-4">⚠</div>
        <div className="text-red-400 font-semibold">Failed to load CMS data</div>
        <div className="text-slate-500 text-sm mt-2">{error}</div>
        <div className="text-slate-600 text-xs mt-3">Make sure cms_plans_enriched.json is in the same directory as index.html</div>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col" style={{background:'transparent',color:'var(--ink)'}}>
      {/* Header */}
      <header className="flex-shrink-0 sticky top-0 z-30 px-6 py-3"
        style={{background:'linear-gradient(180deg,rgba(10,11,18,0.92),rgba(10,11,18,0.72))',backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',borderBottom:'1px solid var(--line)'}}>
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-5">
            <button onClick={()=>setView('landing')} className="flex items-center gap-3 group" title="Back to home">
              <div className="w-9 h-9 rounded-xl flex items-center justify-center"
                style={{background:'linear-gradient(135deg,var(--accent),var(--accent2))',boxShadow:'0 6px 18px -4px rgba(124,108,246,0.7)'}}>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 7.1-1.01L12 2z"/></svg>
              </div>
              <div className="text-left">
                <div className="font-black text-white text-base leading-none tracking-tight">STAR<span style={{color:'var(--gold)'}}>·</span>EXPLORER</div>
                <div className="text-[10px] uppercase tracking-widest mt-0.5 leading-none" style={{color:'#808080'}}>Medicare Advantage Intelligence</div>
              </div>
            </button>
            <div className="w-px h-4" style={{background:'rgba(255,255,255,0.12)'}}/>
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-green-500"/>
              <span className="text-xs" style={{color:'#b3b3b3'}}>Live CMS Data</span>
              <span className="text-xs" style={{color:'#606060'}}>· 2026 Star Ratings (Oct 8 2025) · Enrollment May 2025</span>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="flex items-center rounded-lg p-0.5" style={{background:'#1a1a1a',border:'1px solid rgba(255,255,255,0.08)'}}>
              {[['drill','Drill-Down'],['browse','Browse All'],['movers','Trends ’25→’27']].map(([v,l])=>(
                <button key={v} onClick={()=>setView(v)}
                  className="text-xs font-semibold px-3 py-1.5 rounded-md transition-all"
                  style={view===v?{background:'linear-gradient(135deg,var(--accent),var(--accent2))',color:'#fff'}:{color:'#808080'}}>{l}</button>
              ))}
            </div>
            <span className="text-xs" style={{color:'#808080'}}>
              <span className="text-white font-bold">{view==='browse'?filtered.length:allPlans.length}</span> {view==='browse'?`of ${allPlans.length} `:''}plans
            </span>
            {filtered.filter(p=>p.opportunityScore>=65).length>0&&(
              <div className="flex items-center gap-1.5 rounded-lg px-3 py-1.5"
                style={{background:'rgba(239,68,68,0.14)',border:'1px solid rgba(239,68,68,0.3)'}}>
                <div className="w-1.5 h-1.5 rounded-full signal-pulse" style={{background:'#ef4444'}}/>
                <span className="text-xs font-bold" style={{color:'#f87171'}}>
                  {filtered.filter(p=>p.opportunityScore>=65).length} Critical
                </span>
              </div>
            )}
          </div>
        </div>
      </header>

      {view==='drill' ? (
        <div className="flex-1 overflow-auto min-h-0">
          {anchor
            ? <DrillView anchor={anchor} allPlans={allPlans} onBack={()=>setAnchor(null)} onOpen={setSelected}/>
            : <PlanPicker plans={allPlans} onPick={setAnchor}/>}
        </div>
      ) : view==='movers' ? (
        <div className="flex-1 overflow-auto min-h-0">
          <MoversView plans={allPlans} selected={selected} onOpen={setSelected}/>
        </div>
      ) : (
      <>
      <SummaryCards plans={filtered} total={allPlans.length}/>

      <div className="flex flex-1 min-h-0">
        <FilterSidebar filters={filters} setFilters={f=>{setFilters(f);setPage(1);}} allStates={allStates}/>

        <div className="flex-1 overflow-auto px-6 py-6">
          {isFiltered ? (
            <>
              <div className="flex items-center justify-between mb-5">
                <div className="text-white font-semibold">
                  {filtered.length} plan{filtered.length!==1?'s':''} match your filters
                </div>
                <div className="flex items-center gap-2 text-xs" style={{color:'#808080'}}>
                  <span>Sort:</span>
                  {[['opportunityScore','Opportunity'],['enrollment','Members'],['overall2026','Stars'],['ccAvg','CC Avg']].map(([f,l])=>(
                    <button key={f} onClick={()=>toggleSort(f)}
                      className="px-2.5 py-1 rounded-lg border transition-all"
                      style={sortField===f?{background:'rgba(255,255,255,0.1)',borderColor:'rgba(255,255,255,0.2)',color:'#fff'}:{borderColor:'#333',color:'#808080'}}>
                      {l}{sortField===f?(sortDir==='desc'?' ↓':' ↑'):''}
                    </button>
                  ))}
                </div>
              </div>
              {filtered.length===0 ? (
                <div className="flex flex-col items-center justify-center py-24">
                  <div className="text-5xl mb-4">🔍</div>
                  <div className="text-white font-semibold text-lg">No plans match your filters</div>
                  <div className="text-sm mt-2" style={{color:'#808080'}}>Try adjusting or clearing your filters</div>
                </div>
              ):(
                <>
                  <div className="grid gap-4" style={{gridTemplateColumns:'repeat(auto-fill,minmax(296px,1fr))'}}>
                    {paged.map(plan=>(
                      <PlanCard key={plan.id} plan={plan}
                        isSelected={selected?.id===plan.id}
                        onClick={()=>setSelected(selected?.id===plan.id?null:plan)}/>
                    ))}
                  </div>
                  {hasMore&&(
                    <div className="mt-6 text-center">
                      <button onClick={()=>setPage(p=>p+1)}
                        className="text-sm font-bold px-8 py-2.5 rounded-lg transition-all"
                        style={{background:'var(--accent-soft)',border:'1px solid rgba(124,108,246,0.4)',color:'var(--accent2)'}}>
                        Load more — showing {paged.length} of {filtered.length}
                      </button>
                    </div>
                  )}
                </>
              )}
            </>
          ):(
            netflixRows.map(row=>(
              <NetflixRow key={row.id} icon={row.icon} title={row.title}
                plans={row.plans} selected={selected}
                onSelect={p=>setSelected(selected?.id===p.id?null:p)}/>
            ))
          )}
        </div>
      </div>
      </>
      )}

      {selected&&<PlanDrawer plan={selected} onClose={()=>setSelected(null)}/>}

      <footer className="flex-shrink-0 px-6 py-2 flex items-center justify-between"
        style={{background:'rgba(6,7,12,0.7)',backdropFilter:'blur(10px)',borderTop:'1px solid var(--line)'}}>
        <div className="text-xs" style={{color:'#606060'}}>Data: CMS 2026 Star Ratings (Oct 8 2025) · CMS CPSC Enrollment (May 2025) · All values official CMS published data</div>
        <div className="text-xs" style={{color:'#404040'}}>Star Explorer · Sales Intelligence · Internal Use Only</div>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
